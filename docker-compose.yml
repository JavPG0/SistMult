services:
  postgres: 
    image: postgres:latest
    container_name: spotigres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotigres
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data
    networks:
      - spotigres_network 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  etl:
    build: .
    container_name: spotigres_etl
    depends_on:
      postgres: 
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotigres
    volumes:
      - ./logs:/code/logs
    networks:
      - spotigres_network  
    command: ["python", "./etl.py"]

volumes:
  postgres_data:

networks:
  spotigres_network:
    driver: bridge