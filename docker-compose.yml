services:
# PostgreSQL Database Service
  postgres: 
    image: postgres:latest
    container_name: spotigres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotigres
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data
    networks:
      - spotigres_network 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

# ETL Service
  etl:
    build: .
    container_name: spotigres_etl
    depends_on:
      postgres: 
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotigres
    volumes:
      - ./logs:/code/logs
    networks:
      - spotigres_network  
    command: ["python", "./etl.py"]
    restart: "no"

# Streamlit Application Service
  streamlit:
    build: .
    container_name: spotigres_interface
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotigres
      API_KEY: ${API_KEY}
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/code/logs
      - ./Src/frontend:/code/Src/frontend
    networks:
      - spotigres_network
    command: ["streamlit", "run", "Src/frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8501 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  spotigres_network:
    driver: bridge